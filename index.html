<style>
   body {
            background: linear-gradient(135deg, #0B1426 0%, #1A1D3A 100%);
       color: white;
 font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
    justify-content: center;
     min-height: 100vh;
       margin: 0;
        overflow: hidden;
        }
   
.redirect-container {
       text-align: center;
         padding: 3rem;
      background: rgba(26, 27, 35, 0.9);
            border-radius: 20px;
            border: 1px solid rgba(0, 212, 255, 0.3);
     backdrop-filter: blur(20px);
 max-width: 600px;
     position: relative;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
        }
        
        .logo {
      color: #00D4FF;
       font-size: 3rem;
     font-weight: 700;
     margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
         justify-content: center;
gap: 1rem;
     }

      .logo i {
            animation: pulse 2s ease-in-out infinite;
        }
        
      @keyframes pulse {
            0%, 100% { transform: scale(1); }
50% { transform: scale(1.1); }
    }
        
  .spinner {
     display: inline-block;
  width: 50px;
     height: 50px;
        border: 4px solid rgba(0, 212, 255, 0.2);
     border-left: 4px solid #00D4FF;
    border-radius: 50%;
       animation: spin 1s linear infinite;
     margin: 2rem 0;
     }
   
        @keyframes spin {
            0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
    }
        
        .progress-container {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
   overflow: hidden;
            margin: 2rem 0;
 }
        
.progress-bar {
    height: 100%;
          background: linear-gradient(90deg, #00D4FF, #667EEA);
       border-radius: 4px;
     width: 0%;
            transition: width 0.3s ease;
       animation: glow 2s ease-in-out infinite alternate;
        }
        
    @keyframes glow {
            from { box-shadow: 0 0 5px #00D4FF; }
            to { box-shadow: 0 0 20px #00D4FF, 0 0 30px #00D4FF; }
        }
 
        .btn-primary-gradient {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
   border: none;
            padding: 1rem 2rem;
   color: white;
            text-decoration: none;
         border-radius: 50px;
            font-weight: 600;
      display: inline-block;
        margin-top: 1rem;
       transition: all 0.3s ease;
         box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
    }
        
        .btn-primary-gradient:hover {
   transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
            color: white;
            text-decoration: none;
        }
        
 .stats {
 display: flex;
     justify-content: space-around;
  margin: 2rem 0;
        padding: 1rem 0;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
  }
        
        .stat-item {
   text-align: center;
        }
        
        .stat-number {
   font-size: 1.5rem;
 font-weight: 700;
      color: #00D4FF;
        }
        
 .stat-label {
  font-size: 0.8rem;
            color: #8892B0;
        }
        
        /* Floating background elements */
        .bg-animation {
            position: absolute;
         top: 0;
            left: 0;
   width: 100%;
  height: 100%;
 overflow: hidden;
     z-index: -1;
        }
        
        .floating-shape {
 position: absolute;
          background: rgba(0, 212, 255, 0.1);
  border-radius: 50%;
            animation: float 6s ease-in-out infinite;
    }
        
  .floating-shape:nth-child(1) {
      width: 80px;
          height: 80px;
      top: 20%;
        left: 10%;
          animation-delay: 0s;
   }
        
        .floating-shape:nth-child(2) {
        width: 60px;
          height: 60px;
        top: 60%;
  right: 15%;
            animation-delay: 2s;
     }
        
        .floating-shape:nth-child(3) {
      width: 100px;
         height: 100px;
       bottom: 20%;
     left: 20%;
    animation-delay: 4s;
 }
  
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
      33% { transform: translateY(-20px) rotate(120deg); }
            66% { transform: translateY(10px) rotate(240deg); }
        }
    </style>
</head>
<body>
    <!-- Background Animation -->
    <div class="bg-animation">
     <div class="floating-shape"></div>
      <div class="floating-shape"></div>
     <div class="floating-shape"></div>
    </div>

    <div class="redirect-container">
        <div class="logo">
     <i class="fas fa-chart-line"></i>
    TradePilot
 </div>
    
        <h2 class="mb-3">Welcome to Our Trading Platform</h2>
        <p class="lead mb-4 text-light">
          Redirecting you to our algorithmic trading signals dashboard...
     </p>
    
        <!-- Live Stats -->
<div class="stats">
            <div class="stat-item">
      <div class="stat-number">68%</div>
       <div class="stat-label">Win Rate</div>
            </div>
        <div class="stat-item">
       <div class="stat-number">2.4x</div>
       <div class="stat-label">Avg Return</div>
        </div>
        <div class="stat-item">
     <div class="stat-number">10K+</div>
     <div class="stat-label">Active Traders</div>
    </div>
        </div>
        
        <div class="spinner"></div>
        
        <div class="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
        </div>
        
<p class="mb-3">If you're not automatically redirected, <a href="trading-signals.html" style="color: #00D4FF;">click here</a></p>
     
      <a href="trading-signals.html" class="btn-primary-gradient">
       <i class="fas fa-rocket me-2"></i>
  Enter Trading Platform
        </a>
        
        <div class="mt-4 pt-3" style="border-top: 1px solid rgba(255,255,255,0.1);">
    <small class="text-muted">
           <i class="fas fa-shield-alt me-2"></i>
     Secure & Trusted Platform
  </small>
   </div>
    </div>

    <script>
        // Progress bar animation
        let progress = 0;
        const progressBar = document.getElementById('progress-bar');
        
        const interval = setInterval(() => {
            progress += 3;
            progressBar.style.width = progress + '%';
   
            if (progress >= 100) {
     clearInterval(interval);
          setTimeout(() => {
    window.location.href = 'trading-signals.html';
       }, 500);
    }
        }, 90);
      
        // Immediate redirect for browsers that don't support meta refresh
 setTimeout(function() {
            if (window.location.href.indexOf('trading-signals.html') === -1) {
           window.location.href = 'trading-signals.html';
   }
        }, 3000);
</script>
</body>
